name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate example
        run: logic4life-sleep --config config/default.json --input examples/rules.json --validate-only
      - name: Build distributions
        run: python -m build
      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          logic4life-sleep --help
          python -m logic4life_sleep --print-prompt
